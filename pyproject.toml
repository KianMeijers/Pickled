[project]
name = "meal-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kian Meijers", email = "kian.meijers@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.12.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
meal-planner = "meal_planner:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
