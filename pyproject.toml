[project]
name = "pickled"
version = "0.1.0"
description = "Pickled: a chat-based meal planner built around Dutch supermarket deals and seasonal produce"
readme = "README.md"
authors = [
    { name = "Kian Meijers", email = "kian.meijers@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langgraph-checkpoint-postgres>=3.1.2",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
pickled = "pickled.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real services and spend money: run them with `pytest -m live`.
addopts = ["-m", "not live"]
markers = ["live: calls a real outside service; skipped unless run with `-m live`"]
