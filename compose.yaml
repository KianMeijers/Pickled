services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: pickled
      POSTGRES_PASSWORD: pickled
      POSTGRES_DB: pickled
    ports:
      # Only this machine: the password is a development one.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickled -d pickled"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The app and the worker from the Dockerfile: `docker compose --profile app up --build`.
  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pickled:pickled@db:5432/pickled
    ports:
      # Only this machine: the app has no login.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: [app]
    build: .
    command: ["pickled", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pickled:pickled@db:5432/pickled
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
