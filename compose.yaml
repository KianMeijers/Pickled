services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: pickled
      POSTGRES_PASSWORD: pickled
      POSTGRES_DB: pickled
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickled -d pickled"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
